name: Auto-Generate Static Job Pages & Update Sitemap

on:
  repository_dispatch:
    types: [job_created, update_jobs]
  workflow_dispatch:
  schedule:
    # Runs every 6 hours automatically to ensure all new jobs are indexed
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  build-and-deploy-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Static Job Pages & Sitemap
        run: node scripts/generate-jobs.js

      - name: Commit and Push to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add job/ sitemap.xml
          if git diff --staged --quiet; then
            echo "No new jobs or changes found."
          else
            git commit -m "chore(seo): auto-generate static job pages and update sitemap [skip ci]"
            git push origin main
          fi
